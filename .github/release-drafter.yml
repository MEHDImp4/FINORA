name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🎬 Features & Player Enhancements'
    labels:
      - 'feature'
      - 'player'
  - title: '🐛 Bug Fixes & Reliability'
    labels:
      - 'bug'
  - title: '⚡ Performance & Optimizations'
    labels:
      - 'performance'
  - title: '🛡️ Security & Hardening'
    labels:
      - 'security'
  - title: '📥 Offline Downloads'
    labels:
      - 'downloads'
  - title: '🎨 UI / UX & Design System'
    labels:
      - 'ui/ux'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
  - title: '📦 Dependency Updates'
    labels:
      - 'dependencies'
  - title: '🔧 Maintenance & Tooling'
    labels:
      - 'ci'
      - 'refactor'

version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'performance'
      - 'security'
      - 'refactor'
      - 'dependencies'
  default: patch

template: |
  ## What's Changed in FINORA v$RESOLVED_VERSION

  $CHANGES

  ---
  **Full Changelog**: https://github.com/MEHDImp4/FINORA/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
