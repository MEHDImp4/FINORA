name: Hardening Workbench

on:
  push:
    branches: [fix/hardening-offline-quality-20261101]

permissions:
  contents: write

concurrency:
  group: hardening-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-3-quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hardening-offline-quality-20261101
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install baseline dependencies
        run: npm ci
      - name: Align Expo SDK dependencies
        run: CI=1 npx expo install --fix
      - name: Install ESLint tooling
        run: npm install --save-dev eslint@^9 eslint-config-expo@latest typescript-eslint@^8
      - name: Apply quality configuration
        run: |
          python .planning/quick/20261101-hardening-offline-quality/apply_phase3_quality.py
          python .planning/quick/20261101-hardening-offline-quality/phase3_followup.py
      - name: Audit production dependencies
        run: node scripts/audit-production.js
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint 2>&1 | tee /tmp/lint.log
      - name: Version consistency
        run: npm run version:check
      - name: Check i18n parity
        run: npm run i18n:check
      - name: Test coverage gate
        run: npm test -- --ci --coverage --maxWorkers=2 2>&1 | tee /tmp/tests.log
      - name: Expo doctor
        run: npx expo-doctor 2>&1 | tee /tmp/expo-doctor.log
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Diff sanity
        run: git diff --check
      - name: Commit validated quality gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.js jest.config.js scripts/audit-production.js \
            .github/workflows/ci.yml .github/workflows/build-apk.yml \
            .planning/quick/20261101-hardening-offline-quality/NATIVE_COMPATIBILITY.md
          git commit -m "ci: enforce lint coverage and native compatibility"
          git push origin HEAD:fix/hardening-offline-quality-20261101
