name: Hardening Workbench

on:
  push:
    branches:
      - fix/hardening-offline-quality-20261101

permissions:
  contents: write

concurrency:
  group: hardening-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-offline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v7
        with:
          ref: fix/hardening-offline-quality-20261101
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Apply phase 1 patch
        run: |
          python .planning/quick/20261101-hardening-offline-quality/apply_phase1.py
          python .planning/quick/20261101-hardening-offline-quality/phase1_followup.py

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Offline tests
        id: offline_tests
        shell: bash
        run: |
          set +e
          npm test -- src/features/offline --runInBand > /tmp/offline-tests.log 2>&1
          status=$?
          cat /tmp/offline-tests.log
          exit $status

      - name: Upload offline test diagnostics
        if: failure() && steps.offline_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: phase1-offline-test-failure
          path: /tmp/offline-tests.log
          if-no-files-found: error

      - name: Player offline-route regression tests
        run: npm test -- src/app/player/__tests__/playerRouteOffline.test.tsx --runInBand

      - name: Full test suite
        run: npm test -- --runInBand --no-coverage

      - name: Diff sanity
        run: git diff --check

      - name: Commit validated phase 1 changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/features/offline/offlineStorage.ts src/features/offline/__tests__/offlineStorage.test.ts src/app/player/'[id].tsx' src/app/player/__tests__/playerRouteOffline.test.tsx; then
            echo "No phase 1 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/offline/offlineStorage.ts \
                  src/features/offline/__tests__/offlineStorage.test.ts \
                  src/app/player/'[id].tsx' \
                  src/app/player/__tests__/playerRouteOffline.test.tsx
          git commit -m "fix(offline): serialize mutations and verify local files"
          git push origin HEAD:fix/hardening-offline-quality-20261101
