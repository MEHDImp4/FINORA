name: Hardening Workbench

on:
  push:
    branches:
      - fix/hardening-offline-quality-20261101

permissions:
  contents: read

concurrency:
  group: hardening-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v7
        with:
          ref: fix/hardening-offline-quality-20261101

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Measure current coverage
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --ci --coverage --maxWorkers=2 --coverageReporters=text-summary --coverageReporters=json-summary | tee /tmp/coverage.log
          cp coverage/coverage-summary.json /tmp/coverage-summary.json

      - name: Inspect npm dependency tree
        shell: bash
        run: |
          set +e
          npm ls --all > /tmp/npm-ls.log 2>&1
          status=$?
          echo "npm_ls_exit=$status" > /tmp/npm-ls-status.txt
          cat /tmp/npm-ls.log
          exit 0

      - name: Run Expo Doctor diagnostic
        shell: bash
        run: |
          set +e
          npx expo-doctor > /tmp/expo-doctor.log 2>&1
          status=$?
          echo "expo_doctor_exit=$status" > /tmp/expo-doctor-status.txt
          cat /tmp/expo-doctor.log
          exit 0

      - name: Upload quality baseline
        uses: actions/upload-artifact@v7
        with:
          name: hardening-quality-baseline
          path: |
            /tmp/coverage.log
            /tmp/coverage-summary.json
            /tmp/npm-ls.log
            /tmp/npm-ls-status.txt
            /tmp/expo-doctor.log
            /tmp/expo-doctor-status.txt
          if-no-files-found: error
