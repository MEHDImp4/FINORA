name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Type d APK a generer (preview, beta, release, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - preview
          - beta
          - release
  push:
    tags:
      - 'v*'
      - '*-beta*'
      - '*-preview*'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Preview APK
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'preview' || inputs.target == 'all')) || (github.event_name == 'push' && contains(github.ref, 'preview')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Preview APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug -PreactNativeReleaseLevel=preview

      - name: Prepare Preview Artifact & Checksum
        id: prepare
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_NAME="finora-v${VERSION}-preview-${SHORT_SHA}.apk"
          
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Preview APK: ${APK_NAME}"
          cat "${APK_NAME}.sha256"

      - name: Upload Preview APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-preview-apk
          path: |
            finora-*-preview-*.apk
            finora-*-preview-*.apk.sha256
          retention-days: 14

  build-beta:
    name: Build Beta APK
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'beta' || inputs.target == 'all')) || (github.event_name == 'push' && (contains(github.ref, 'beta') || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Beta APK (assembleRelease)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=beta

      - name: Prepare Beta Artifact & Checksum
        id: prepare
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_NAME="finora-v${VERSION}-beta-${SHORT_SHA}.apk"
          
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Beta Release APK not found!"
            exit 1
          fi
          
          cp "$RELEASE_APK" "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Beta APK: ${APK_NAME}"
          cat "${APK_NAME}.sha256"

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-beta-apk
          path: |
            finora-*-beta-*.apk
            finora-*-beta-*.apk.sha256
          retention-days: 30

  build-release:
    name: Build Release APK
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'release' || inputs.target == 'all')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Release APK (assembleRelease)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=stable

      - name: Sign & Prepare Release Artifact
        id: prepare
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_NAME="finora-v${VERSION}-release.apk"
          
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Production Release APK not found!"
            exit 1
          fi
          
          # If signing secrets are provided, sign with release keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "Signing with configured release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER sign --ks release.keystore \
                --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
                --out "${APK_NAME}" \
                "$RELEASE_APK"
              rm -f release.keystore
            else
              echo "Warning: apksigner not found, using raw build APK."
              cp "$RELEASE_APK" "${APK_NAME}"
            fi
          else
            echo "No release keystore secret configured: using build signing configuration."
            cp "$RELEASE_APK" "${APK_NAME}"
          fi
          
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Release APK: ${APK_NAME}"
          cat "${APK_NAME}.sha256"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-release-apk
          path: |
            finora-*-release.apk
            finora-*-release.apk.sha256
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            finora-*-release.apk
            finora-*-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
