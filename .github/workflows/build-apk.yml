name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Type d APK a generer (preview, beta, release, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - preview
          - beta
          - release
  push:
    tags:
      - 'v*'
      - '*-beta*'
      - '*-preview*'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Preview APK
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'preview' || inputs.target == 'all')) || (github.event_name == 'push' && contains(github.ref, 'preview')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Preview APK (assembleRelease)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=preview

      - name: Prepare Preview Artifact & Checksum
        id: prepare
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_NAME="finora-v${VERSION}-preview-${SHORT_SHA}.apk"
          
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Preview Release APK not found!"
            exit 1
          fi
          
          cp "$RELEASE_APK" "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          
          CHANGELOG=$(git log -n 10 --pretty=format:"- %s (%h)")
          {
            echo "### 🎬 FINORA Preview Build (Standalone)"
            echo "- **Version**: \`v${VERSION}\`"
            echo "- **Commit**: \`${SHORT_SHA}\`"
            echo "- **Type**: Standalone Preview APK (assembleRelease)"
            echo ""
            echo "📥 **Direct Installation**: Tap the \`.apk\` file below on your Android device to download and install in 1 click (no zip archive to extract)."
            echo ""
            echo "---"
            echo ""
            echo "### 📋 Recent Changes (Changelog)"
            echo "$CHANGELOG"
          } > preview_release_notes.md

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Preview APK: ${APK_NAME}"
          cat "${APK_NAME}.sha256"

      - name: Upload Preview APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-preview-apk
          path: |
            finora-*-preview-*.apk
            finora-*-preview-*.apk.sha256
          retention-days: 14

      - name: Publish Preview GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ steps.prepare.outputs.version }}-preview-${{ steps.prepare.outputs.short_sha }}"
          name: "FINORA v${{ steps.prepare.outputs.version }} (Preview ${{ steps.prepare.outputs.short_sha }})"
          prerelease: false
          make_latest: true
          body_path: preview_release_notes.md
          generate_release_notes: false
          files: |
            finora-*-preview-*.apk
            finora-*-preview-*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Git Tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest build: v${{ steps.prepare.outputs.version }} (${{ steps.prepare.outputs.short_sha }})"
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-beta:
    name: Build Beta APK
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'beta' || inputs.target == 'all')) || (github.event_name == 'push' && (contains(github.ref, 'beta') || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Beta APK (assembleRelease)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=beta

      - name: Prepare Beta Artifact & Checksum
        id: prepare
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_NAME="finora-v${VERSION}-beta-${SHORT_SHA}.apk"
          
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Beta Release APK not found!"
            exit 1
          fi
          
          cp "$RELEASE_APK" "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          
          CHANGELOG=$(git log -n 12 --pretty=format:"- %s (%h)")
          {
            echo "### 🚀 FINORA Beta Build"
            echo "- **Version**: \`v${VERSION}\`"
            echo "- **Commit**: \`${SHORT_SHA}\`"
            echo "- **Type**: Standalone Beta APK (assembleRelease)"
            echo ""
            echo "📥 **Direct Installation**: Tap the \`.apk\` file below on your Android device to download and install in 1 click (no zip archive to extract)."
            echo ""
            echo "---"
            echo ""
            echo "### 📋 Recent Changes (Changelog)"
            echo "$CHANGELOG"
          } > beta_release_notes.md

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Beta APK: ${APK_NAME}"
          cat "${APK_NAME}.sha256"

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-beta-apk
          path: |
            finora-*-beta-*.apk
            finora-*-beta-*.apk.sha256
          retention-days: 30

      - name: Publish Beta GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-beta-{1}', steps.prepare.outputs.version, steps.prepare.outputs.short_sha) }}
          name: "FINORA v${{ steps.prepare.outputs.version }} (Beta ${{ steps.prepare.outputs.short_sha }})"
          prerelease: false
          make_latest: true
          body_path: beta_release_notes.md
          generate_release_notes: false
          files: |
            finora-*-beta-*.apk
            finora-*-beta-*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Git Tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest beta: v${{ steps.prepare.outputs.version }} (${{ steps.prepare.outputs.short_sha }})"
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release APK
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'release' || inputs.target == 'all')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Release APK (assembleRelease)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=stable

      - name: Sign & Prepare Release Artifact
        id: prepare
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_NAME="finora-v${VERSION}-release.apk"
          
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Production Release APK not found!"
            exit 1
          fi
          
          # If signing secrets are provided, sign with release keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "Signing with configured release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER sign --ks release.keystore \
                --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
                --out "${APK_NAME}" \
                "$RELEASE_APK"
              rm -f release.keystore
            else
              echo "Warning: apksigner not found, using raw build APK."
              cp "$RELEASE_APK" "${APK_NAME}"
            fi
          else
            echo "No release keystore secret configured: using build signing configuration."
            cp "$RELEASE_APK" "${APK_NAME}"
          fi
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          
          CHANGELOG=$(git log -n 15 --pretty=format:"- %s (%h)")
          {
            echo "### 🌟 FINORA Production Release"
            echo "- **Version**: \`v${VERSION}\`"
            echo "- **Commit**: \`${SHORT_SHA}\`"
            echo "- **Type**: Production Release APK"
            echo ""
            echo "📥 **Direct Installation**: Tap the \`.apk\` file below on your Android smartphone to download and install in 1 click (no zip archive to extract)."
            echo ""
            echo "---"
            echo ""
            echo "### 📋 Release Notes & Highlights (Changelog)"
            echo "See the full [CHANGELOG.md](https://github.com/MEHDImp4/FINORA/blob/master/CHANGELOG.md) for detailed features and bug fixes."
            echo ""
            echo "#### Recent Highlights:"
            echo "$CHANGELOG"
          } > release_notes.md

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Release APK: ${APK_NAME}"
          cat "${APK_NAME}.sha256"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-release-apk
          path: |
            finora-*-release.apk
            finora-*-release.apk.sha256
          retention-days: 90

      - name: Publish Production GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.prepare.outputs.version) }}
          name: "FINORA v${{ steps.prepare.outputs.version }}"
          prerelease: false
          make_latest: true
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            finora-*-release.apk
            finora-*-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Git Tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest production release: v${{ steps.prepare.outputs.version }}"
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
