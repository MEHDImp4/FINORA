name: Build Android APKs

# Release channels are mutually exclusive:
#   - push tag vX.Y.Z            -> stable  (prerelease:false, make_latest:true, release-signed)
#   - push tag vX.Y.Z-beta.N     -> beta    (prerelease:true,  make_latest:false)
#   - push tag vX.Y.Z-preview-SHA-> preview (prerelease:true,  make_latest:false)
#   - manual dispatch            -> exactly one channel (preview|beta|release)
# For any event at most one publication job is eligible.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Release channel to build'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - beta
          - release
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Mandatory quality gate — no build starts until this passes ──────────────
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Version consistency
        run: npm run version:check

      - name: Check i18n parity
        run: npm run i18n:check

      - name: Run tests
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --maxWorkers=2

      # Advisory only: known Expo SDK patch mismatches must not block releases.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

  # ── Classify a pushed tag into exactly one channel ──────────────────────────
  classify:
    name: Classify tag
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Classify release tag
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          KIND="none"
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref_name }}"
            if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              KIND="stable"
            elif printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
              KIND="beta"
            elif printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-preview[-.][A-Za-z0-9]+$'; then
              KIND="preview"
            else
              echo "::error::Unsupported tag format '$REF'. Allowed: vX.Y.Z, vX.Y.Z-beta.N, vX.Y.Z-preview-<sha>."
              exit 1
            fi
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Classified '${{ github.ref_name }}' as '$KIND'."

  # ── Preview (prerelease, never Latest) ──────────────────────────────────────
  build-preview:
    name: Build Preview APK
    needs: [quality, classify]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') || (github.event_name == 'push' && needs.classify.outputs.kind == 'preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}-preview-${SHORT_SHA}"
          fi
          node scripts/version.js --tag="$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=FINORA-v${VERSION}-preview-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"
          echo "release_name=FINORA v${VERSION} (Preview ${SHORT_SHA})" >> "$GITHUB_OUTPUT"
      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew
      - name: Build Preview APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=preview
      - name: Prepare artifact & checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK" ]; then echo "::error::Preview APK not found"; exit 1; fi
          cp "$RELEASE_APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-preview-apk
          path: |
            FINORA-v*-preview-*.apk
            FINORA-v*-preview-*.apk.sha256
          retention-days: 14
      - name: Publish preview GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.apk_name }}
            ${{ steps.meta.outputs.apk_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Beta (prerelease, never Latest) ─────────────────────────────────────────
  build-beta:
    name: Build Beta APK
    needs: [quality, classify]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'beta') || (github.event_name == 'push' && needs.classify.outputs.kind == 'beta') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}-beta.${{ github.run_number }}"
          fi
          node scripts/version.js --tag="$TAG"
          TAG_VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=FINORA-v${TAG_VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "release_name=FINORA v${TAG_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew
      - name: Build Beta APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=beta
      - name: Prepare artifact & checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK" ]; then echo "::error::Beta APK not found"; exit 1; fi
          cp "$RELEASE_APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"
      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-beta-apk
          path: |
            FINORA-v*-beta.*.apk
            FINORA-v*-beta.*.apk.sha256
          retention-days: 30
      - name: Publish beta GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.apk_name }}
            ${{ steps.meta.outputs.apk_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stable (release-signed, Latest) — fail-closed on signing ────────────────
  build-release:
    name: Build Stable APK
    needs: [quality, classify]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'release') || (github.event_name == 'push' && needs.classify.outputs.kind == 'stable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          node scripts/version.js --tag="$TAG"
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Stable tag $TAG does not match package.json version $VERSION. Refusing to publish."
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=FINORA-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "release_name=FINORA v${VERSION}" >> "$GITHUB_OUTPUT"
      # FAIL-CLOSED: a stable release can never fall back to debug/default signing.
      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Refusing to build a production APK."
            exit 1
          fi
      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew
      - name: Build Stable APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=stable
      - name: Sign APK with release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK" ]; then echo "::error::Release APK not found"; exit 1; fi

          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          APKSIGNER=$(find "$BUILD_TOOLS" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found in $BUILD_TOOLS"; exit 1; fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_NAME" \
            "$RELEASE_APK"
          rm -f release.keystore
          echo "Signed $APK_NAME"
      - name: Verify APK signature (fail on debug certificate)
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          APKSIGNER=$(find "$BUILD_TOOLS" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi

          # Non-zero exit (with pipefail) fails the job on an invalid signature.
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee apksigner-verify.txt

          if grep -qiE 'CN=Android Debug' apksigner-verify.txt; then
            echo "::error::APK is signed with the Android debug certificate. Refusing to publish a production release."
            exit 1
          fi
      - name: Compute checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"
      - name: Upload stable artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-release-apk
          path: |
            FINORA-v*.apk
            FINORA-v*.apk.sha256
          retention-days: 90
      - name: Publish stable GitHub Release (Latest)
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.apk_name }}
            ${{ steps.meta.outputs.apk_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
