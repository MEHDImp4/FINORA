name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, Tests & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Version consistency
        run: npm run version:check

      - name: Check i18n parity
        run: npm run i18n:check

      # Advisory only: known Expo SDK patch mismatches must not fail CI.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

      - name: Run tests
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --maxWorkers=2
