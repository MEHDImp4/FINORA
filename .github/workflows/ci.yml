name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, Tests & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: node scripts/audit-production.js

      - name: Type check
        run: npm run typecheck

      - name: Version consistency
        run: npm run version:check

      - name: Check i18n parity
        run: npm run i18n:check

      # Advisory only: known Expo SDK patch mismatches must not fail CI.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

      - name: Diagnostic - player tests serial
        id: player_tests
        continue-on-error: true
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --runInBand src/features/player

      - name: Diagnostic - non-player tests serial
        id: non_player_tests
        continue-on-error: true
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --runInBand --testPathIgnorePatterns=src/features/player/__tests__

      - name: Diagnostic - full suite serial
        id: full_serial
        continue-on-error: true
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --runInBand

      - name: Diagnostic - full suite parallel
        id: full_parallel
        continue-on-error: true
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --maxWorkers=2

      - name: Fail if diagnostics failed
        if: steps.player_tests.outcome == 'failure' || steps.non_player_tests.outcome == 'failure' || steps.full_serial.outcome == 'failure' || steps.full_parallel.outcome == 'failure'
        run: exit 1
