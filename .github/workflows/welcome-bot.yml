name: "Welcome First-time Contributors"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Greet New Contributor
    runs-on: ubuntu-latest
    steps:
      - name: Welcome First-time Issue & PR Authors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hello and welcome to the **FINORA** community! 🎉
            Thank you for opening your first issue on the project.
            
            Our team will review your report shortly. In the meantime, feel free to explore our [Documentation](https://github.com/MEHDImp4/FINORA#readme) or join our [Discussions](https://github.com/MEHDImp4/FINORA/discussions). 🎬🍿
          pr-message: |
            👋 Welcome and thank you for your very first Pull Request to **FINORA**! 🚀
            
            We truly appreciate your contribution. Our automated workflows are currently validating your changes (unit tests, TypeScript strict mode, conventional commits).
            
            Please feel free to review our [Contributing Guide (CONTRIBUTING.md)](https://github.com/MEHDImp4/FINORA/blob/master/CONTRIBUTING.md) if you haven't already. 🍿
