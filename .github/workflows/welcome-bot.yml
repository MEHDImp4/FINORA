name: "Welcome First-time Contributors"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Greet New Contributor
    runs-on: ubuntu-latest
    steps:
      - name: Welcome First-time Issue & PR Authors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hello @${{ github.actor }} and welcome to **FINORA**! 🎉

            Thank you for opening your first issue.
            - Please make sure you have filled in all required fields from the issue template.
            - ⚠️ **Security reminder**: Never post passwords, access tokens, API keys, or private server credentials.
            
            A maintainer will review your report shortly. Feel free to join our [GitHub Discussions](https://github.com/MEHDImp4/FINORA/discussions) for general questions and feedback.
          pr-message: |
            👋 Welcome @${{ github.actor }} and thank you for your first Pull Request to **FINORA**! 🚀

            - Please ensure all CI checks (TypeScript strict validation, automated tests, Expo Doctor) pass.
            - A maintainer will review your code according to our [Contributing Guide](https://github.com/MEHDImp4/FINORA/blob/master/CONTRIBUTING.md).

            Thank you for helping make FINORA better! 🎬🍿
