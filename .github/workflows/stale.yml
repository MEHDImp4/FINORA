name: "Stale Issues & PRs Manager"

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Manage Inactive Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark and Close Stale Items
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 45
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            Hello! This issue has been marked as **stale** because it has had no activity for 45 days.
            
            If this issue still persists with the latest release of FINORA, please leave a comment to keep it active. Otherwise, it will be automatically closed in 7 days. Thank you!
          close-issue-message: |
            This issue was automatically closed due to inactivity. Feel free to open a new issue with updated details if you still experience this problem.
          
          days-before-pr-stale: 45
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            Hello! This Pull Request has been marked as **stale** because it has had no activity for 45 days.
            
            Please rebase or update your branch, or leave a comment if work is still ongoing. It will be closed in 7 days without activity.
          close-pr-message: |
            This Pull Request was closed due to inactivity. Thank you for your time and contributions!

          exempt-issue-labels: 'pinned,security,enhancement,keep,blocked'
          exempt-pr-labels: 'pinned,security,enhancement,keep,work-in-progress,wip'
