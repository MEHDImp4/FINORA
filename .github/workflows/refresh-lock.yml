name: Refresh lockfile for security remediation

on:
  push:
    branches:
      - 'release/prepare-v1.0.1'
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/prepare-v1.0.1
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Re-resolve patched npm dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate pinned lockfile
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {'node-forge':'1.4.3', 'zod':'4.6.6', 'decode-uri-component':'0.5.1'};
          for (const [name, version] of Object.entries(expected)) {
            const actual = lock.packages['node_modules/'+name]?.version;
            if (actual !== version) throw new Error(name+': expected '+version+' got '+actual);
          }
          console.log('Pinned dependencies verified.');
          NODE
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
          else
            git commit -m "fix(deps): pin patched security dependencies [skip ci]"
            git push origin HEAD:release/prepare-v1.0.1
          fi
