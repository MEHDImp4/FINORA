name: RC Android Build Validation

# Dry-run release pipeline for the Android Release Candidate.
#
# It runs the EXACT production build path (quality -> expo prebuild -> Gradle
# assembleRelease -> production signing -> apksigner verify -> checksum) but
# NEVER publishes a GitHub Release, NEVER creates a tag and NEVER marks Latest.
#
# - Push to `rc/vX.Y.Z-build-validation`, or run it manually.
# - The same four ANDROID_* signing secrets required by stable are mandatory here.
#   Missing signing material fails closed: an unsigned/debug-signed RC is never
#   accepted as release validation evidence.

on:
  workflow_dispatch:
  push:
    branches:
      - 'rc/v*-build-validation'

permissions:
  contents: read

concurrency:
  group: rc-build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Type check
        run: npm run typecheck

      - name: Version consistency
        run: npm run version:check

      - name: Check i18n parity
        run: npm run i18n:check

      - name: Run tests
        run: npm test -- --ci --no-coverage --passWithNoTests --forceExit --maxWorkers=2

      # Advisory only: known Expo SDK patch mismatches must not block RC validation.
      - name: Expo doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

  build:
    name: Build + sign (dry-run, no publish)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Toolchain versions
        run: |
          set -euo pipefail
          node -v
          java -version
          node -p "require('expo/package.json').version"
          node -p "require('react-native/package.json').version"
          node -p "require('@react-native/gradle-plugin/package.json').version"

      - name: Resolve RC metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          node scripts/version.js --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=FINORA-v${VERSION}-rc-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

      # EXACTLY like stable: release validation is meaningless without production signing.
      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Refusing to validate an unsigned RC."
            exit 1
          fi

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Gradle wrapper + version
        run: |
          set -euo pipefail
          cat android/gradle/wrapper/gradle-wrapper.properties
          cd android
          ./gradlew --version

      - name: Build Stable APK (base)
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeReleaseLevel=stable

      - name: Sign APK with release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK" ]; then echo "::error::Release APK not found"; exit 1; fi

          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          APKSIGNER=$(find "$BUILD_TOOLS" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found in $BUILD_TOOLS"; exit 1; fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_NAME" \
            "$RELEASE_APK"
          rm -f release.keystore
          echo "Signed $APK_NAME"

      - name: Verify APK signature (fail on debug certificate)
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          APKSIGNER=$(find "$BUILD_TOOLS" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee apksigner-verify.txt
          if grep -qiE 'CN=Android Debug' apksigner-verify.txt; then
            echo "::error::APK is signed with the Android debug certificate. Refusing to accept this RC."
            exit 1
          fi

      - name: Inspect APK manifest and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          AAPT=$(find "$BUILD_TOOLS" -name aapt 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "$BUILD_TOOLS" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AAPT" ] || [ -z "$AAPT2" ]; then
            echo "::error::aapt/aapt2 not found in $BUILD_TOOLS"
            exit 1
          fi
          {
            echo "### APK: $APK_NAME"
            echo "## aapt dump badging"
            "$AAPT" dump badging "$APK_NAME" | grep -E "package:|versionCode|versionName|sdkVersion|targetSdkVersion|uses-permission|application-label|application-debuggable" || true
            echo ""
            echo "## Manifest flags (aapt2 xmltree)"
            "$AAPT2" dump xmltree "$APK_NAME" --file AndroidManifest.xml | grep -iE "debuggable|usesCleartextTraffic|supportsPictureInPicture|foregroundServiceType|allowBackup" || true
          } | tee apk-inspection.txt

      - name: Compute SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='${{ steps.meta.outputs.apk_name }}'
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - name: Upload RC validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-rc-validation
          path: |
            FINORA-v*-rc-*.apk
            FINORA-v*-rc-*.apk.sha256
            apk-inspection.txt
            apksigner-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FINORA RC Android dry-run"
            echo ""
            echo "- Production signing: verified"
            echo "- RC APK: \`${{ steps.meta.outputs.apk_name }}\`"
            echo "- Publication: disabled by design (no tag and no GitHub Release created)."
          } >> "$GITHUB_STEP_SUMMARY"
