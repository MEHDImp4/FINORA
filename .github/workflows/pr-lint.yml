name: "PR Quality & Rules Linter"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: read
  statuses: write

jobs:
  title-lint:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "The commit subject must not start with an uppercase letter."
          wip: true

  body-and-checklist-lint:
    name: Validate PR Description & Checklist
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Description and Checklist
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const errors = [];

            // 1. Check description length
            const cleanBody = body.replace(/<!--[\s\S]*?-->/g, '').trim();
            if (cleanBody.length < 30) {
              errors.push("⚠️ **Description too short or empty**: Please provide a concise summary of what was changed and the motivation.");
            }

            // 2. Check if default placeholder wasn't touched
            if (body.includes("*(paste screenshot)*") && (body.includes("🐛") || body.includes("💄"))) {
              // optional warning, not an error
            }

            // 3. Check for at least one checked item in the checklist
            const checkedBoxes = (body.match(/-\s*\[x\]/gi) || []).length;
            if (checkedBoxes === 0) {
              errors.push("⚠️ **Incomplete checklist**: Please check at least the applicable boxes in the quality & security checklist.");
            }

            // 4. Check AI assistance section if present in the body
            if (body.includes("AI Assistance")) {
              const aiSectionMatch = body.match(/## 🤖 AI Assistance[\s\S]*?(?=##|---|$)/i);
              if (aiSectionMatch) {
                const aiSection = aiSectionMatch[0];
                const aiChecked = (aiSection.match(/-\s*\[x\]/gi) || []).length;
                if (aiChecked === 0) {
                  errors.push("🤖 **AI Assistance incomplete**: Please indicate whether AI assistance was used (check 'No' or the applicable 'Yes' option).");
                }
              }
            }

            if (errors.length > 0) {
              const commentBody = [
                `👋 Hello @${pr.user.login}! Thank you for contributing to **FINORA** 🎬.`,
                "",
                "To ensure high code quality, our automated bot noticed a few missing details:",
                ...errors.map(e => `- ${e}`),
                "",
                "👉 *Please edit your Pull Request description to complete these items.*"
              ].join("\n");

              // Post or update comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes("Thank you for contributing to **FINORA**"));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody
                });
              }

              core.setFailed("PR description or checklist did not meet requirements.");
            } else {
              core.info("PR description and checklist validation passed!");
            }

  lockfile-check:
    name: Check Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Verify package-lock.json if package.json was touched
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const filenames = files.map(f => f.filename);
            const packageJsonChanged = filenames.includes("package.json");
            const lockfileChanged = filenames.includes("package-lock.json");

            if (packageJsonChanged && !lockfileChanged) {
              core.setFailed("❌ 'package.json' was modified without updating 'package-lock.json'. Please run 'npm install' and commit the updated lockfile.");
            } else {
              core.info("Lockfile integrity check passed.");
            }
