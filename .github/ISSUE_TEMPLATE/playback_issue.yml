name: 🎬 Playback & Video Streaming Issue
description: Report a playback error, audio/subtitle sync issue, or transcoding problem
title: "[Playback]: "
labels: ["bug", "player", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template specifically for video player issues, codec incompatibilities, subtitle rendering (ASS/SSA, PGS, SRT), audio track selection, or transcoding problems.
        
        ⚠️ **SECURITY NOTICE**: NEVER include passwords, authentication tokens, API keys, or private server credentials in your issue or logs.

  - type: textarea
    id: issue-summary
    attributes:
      label: Playback Issue Description
      description: Describe what fails during playback (e.g. infinite buffering, black screen with audio, subtitle desync, transcode failure).
      placeholder: Describe playback behavior...
    validations:
      required: true

  - type: dropdown
    id: stream-mode
    attributes:
      label: Playback / Stream Mode
      description: Which stream mode was being used?
      options:
        - "Direct Play"
        - "Direct Stream"
        - "Transcode (Server-side)"
        - "Offline Download Playback"
        - "Unknown / Not Sure"
    validations:
      required: true

  - type: dropdown
    id: media-container
    attributes:
      label: Media Container Format
      options:
        - "MKV (.mkv)"
        - "MP4 (.mp4 / .m4v)"
        - "WebM (.webm)"
        - "AVI / TS / Other"
        - "Unknown"
    validations:
      required: true

  - type: dropdown
    id: video-codec
    attributes:
      label: Video Codec & Resolution
      options:
        - "H.264 (AVC) - 1080p / 720p"
        - "H.264 (AVC) - 4K"
        - "H.265 (HEVC) - 1080p / SDR"
        - "H.265 (HEVC) - 4K HDR10 / Dolby Vision"
        - "AV1"
        - "VP9"
        - "Other / Unknown"
    validations:
      required: true

  - type: dropdown
    id: audio-codec
    attributes:
      label: Audio Codec & Channels
      options:
        - "AAC (Stereo 2.0)"
        - "AAC (Surround 5.1)"
        - "AC3 / E-AC3 (Dolby Digital / Plus)"
        - "DTS / DTS-HD MA"
        - "TrueHD / Atmos"
        - "FLAC / Opus / Vorbis"
        - "Other / Unknown"
    validations:
      required: true

  - type: dropdown
    id: subtitle-format
    attributes:
      label: Subtitle Track Format (if active)
      options:
        - "None / Disabled"
        - "SubRip (.srt)"
        - "WebVTT (.vtt)"
        - "Advanced SubStation Alpha (.ass / .ssa)"
        - "PGS / VOBSUB (Picture-based)"
        - "Other"
    validations:
      required: true

  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin Server Version
      description: Server version (e.g. 10.9.11, 10.10.3).
      placeholder: e.g. 10.9.11
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device & Operating System
      description: The device manufacturer, model, and OS version.
      placeholder: e.g. Samsung Galaxy S24 (Android 14) / iPhone 15 (iOS 18)
    validations:
      required: true

  - type: textarea
    id: playback-logs
    attributes:
      label: Player Diagnostics & Logs
      description: |
        Paste relevant log snippets from the app or server.
        ⚠️ Verify that no user tokens, passwords, or personal server addresses are present.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have tested if the media plays correctly in Jellyfin Web or other clients.
          required: true
        - label: I am using the latest version of FINORA.
          required: true
        - label: I have sanitized all logs to ensure no private credentials or tokens are shared.
          required: true
