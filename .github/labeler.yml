# Configuration for actions/labeler v5
# Labels PRs automatically based on changed file paths

"player":
  - changed-files:
      - any-glob-to-any-file: "src/features/player/**"

"downloads":
  - changed-files:
      - any-glob-to-any-file: "src/features/offline/**"

"ui/ux":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"
          - "src/design-system/**"
          - "src/app/**"
          - "src/features/home/**"
          - "src/features/details/**"

"search":
  - changed-files:
      - any-glob-to-any-file: "src/features/search/**"

"library":
  - changed-files:
      - any-glob-to-any-file: "src/features/library/**"

"authentication":
  - changed-files:
      - any-glob-to-any-file:
          - "src/features/onboarding/**"
          - "src/core/jellyfin/auth*"

"networking":
  - changed-files:
      - any-glob-to-any-file: "src/core/network/**"

"security":
  - changed-files:
      - any-glob-to-any-file:
          - "src/core/security/**"
          - "src/core/storage/secureStore*.ts"
          - "SECURITY*.md"

"android":
  - changed-files:
      - any-glob-to-any-file:
          - "android/**"
          - "plugins/**"

"ios":
  - changed-files:
      - any-glob-to-any-file: "ios/**"

"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "eas.json"

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
